version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    # A week for a bad release to be caught and pulled before it is proposed here.
    cooldown:
      default-days: 7
    commit-message:
      prefix: "deps"

  # Also keeps gradle.lockfile in step with build.gradle.kts.
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "deps"
