name: Release

on:
  push:
    tags: ["v*"]

jobs:
  build-macos:
    runs-on: macos-latest
    # Kotlin Native macOS targets cannot be cross-compiled from Linux.
    # hdiutil and create-dmg are macOS-only. A macOS runner is required.
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25

      - name: Cache Kotlin Native toolchain
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-macos-${{ hashFiles('**/*.gradle.kts', '**/gradle.properties') }}
          restore-keys: konan-macos-

      - name: Install tools
        run: make install bins

      - name: Build DMG
        run: make macos_dmg

      - uses: actions/upload-artifact@v6
        with:
          name: macos-dmg
          path: build/Ofis.dmg

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25

      - name: Cache Kotlin Native toolchain
        uses: actions/cache@v5
        with:
          path: ~/.konan
          key: konan-linux-${{ hashFiles('**/*.gradle.kts', '**/gradle.properties') }}
          restore-keys: konan-linux-

      - name: Build package
        run: make linux_package

      - uses: actions/upload-artifact@v6
        with:
          name: linux-package
          path: build/ofis-*-linux-x64.tar.gz

  release:
    needs: [build-macos, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: macos-dmg
          path: dist/

      - uses: actions/download-artifact@v8
        with:
          name: linux-package
          path: dist/

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
