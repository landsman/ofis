name: Release

# Manual on purpose while Ofis is in beta, so the macOS runner, billed at 10x, stays off
# every push. A run builds the commit it was started from. Given a tag, it then tags that
# commit and publishes the DMG as a pre-release with generated notes.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: New tag for the selected commit, e.g. beta-0.1.0, to publish the DMG under. Empty builds an artifact only.
        type: string

jobs:
  macos:
    # Kotlin/Native cannot cross-compile a macOS target, and create-dmg needs hdiutil.
    # The runner is Apple Silicon, the only target the Makefile packages (MacosArm64).
    runs-on: macos-latest
    # Shows each build in the Environments sidebar, as in adminer-desktop. Named after the
    # platform and not the runner image, which changes at the next bump, and renaming an
    # environment loses its deployment history.
    environment: macos-arm64
    permissions:
      contents: write
    steps:
      # Before the build: a tag already on another commit would otherwise get a DMG built
      # from this one. To rebuild an existing tag, start the run from the tag itself.
      - name: Check the tag is new or already on this commit
        if: inputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/tags/$TAG" --jq .sha 2>/dev/null) || exit 0
          [ "$sha" = "$GITHUB_SHA" ] || { echo "::error::$TAG is already on $sha. Start the run from that tag, or pick a new one."; exit 1; }

      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - name: Cache Kotlin Native toolchain
        uses: actions/cache@v6
        with:
          path: ~/.konan
          key: konan-macos-${{ hashFiles('**/*.gradle.kts', '**/gradle.properties') }}
          restore-keys: konan-macos-

      # create-dmg and dylibbundler, plus the qpdf and gs that go inside the bundle.
      - run: make install-bins

      - run: make macos_dmg

      - uses: actions/upload-artifact@v7
        with:
          name: ofis-macos-arm64
          path: build/Ofis.dmg
          if-no-files-found: error

      # Last, so a failed build leaves no tag behind. `gh release create` makes the tag on
      # this commit; a re-run finds the release and only replaces the DMG. Drop --prerelease
      # at the first stable tag.
      - name: Tag and publish the DMG
        if: inputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --target "$GITHUB_SHA" --title "Ofis $TAG" --prerelease --generate-notes
          gh release upload "$TAG" build/Ofis.dmg --clobber
