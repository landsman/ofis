name: Release

# Manual on purpose while Ofis is in beta, so the macOS runner, billed at 10x, stays off
# every push. A run builds the commit it was started from. Given a tag, it then tags that
# commit and publishes the DMG as a pre-release with generated notes.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to publish the DMG under, e.g. beta-0.1.0. An existing tag is built as it is, a new one is created on the selected branch. Empty builds an artifact only.
        type: string

jobs:
  macos:
    # Kotlin/Native cannot cross-compile a macOS target, and create-dmg needs hdiutil.
    # The runner is Apple Silicon, the only target the Makefile packages (MacosArm64).
    runs-on: macos-latest
    # Shows each build in the Environments sidebar, as in adminer-desktop. Named after the
    # platform and not the runner image, which changes at the next bump, and renaming an
    # environment loses its deployment history.
    environment: macos-arm64
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      # A tag that already exists is built as it is, whichever branch the run started from.
      - name: Check out the tag if it exists
        if: inputs.tag != ''
        env:
          TAG: ${{ inputs.tag }}
        run: scripts/release.sh checkout "$TAG"

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - name: Cache Kotlin Native toolchain
        uses: actions/cache@v6
        with:
          path: ~/.konan
          key: konan-macos-${{ hashFiles('**/*.gradle.kts', '**/gradle.properties') }}
          restore-keys: konan-macos-

      # create-dmg and dylibbundler, plus the qpdf and gs that go inside the bundle.
      - run: make install-bins

      - run: make macos_dmg

      - uses: actions/upload-artifact@v7
        with:
          name: ofis-macos-arm64
          path: build/Ofis.dmg
          if-no-files-found: error

      # Last, so a failed build leaves no tag behind. Drop --prerelease in the script at the
      # first stable tag.
      - name: Tag and publish the DMG
        if: inputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: scripts/release.sh publish "$TAG" build/Ofis.dmg
