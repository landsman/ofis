name: Release

# Manual on purpose while Ofis is in beta: the release and its notes are written by hand
# on GitHub, and this only builds the DMG and attaches it. A pushed tag publishes nothing,
# and the macOS runner, billed at 10x, stays off every `git push --tags`.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag — build it and attach the DMG to its release. Empty builds the selected branch into an artifact only.
        type: string

jobs:
  macos:
    # Kotlin/Native cannot cross-compile a macOS target, and create-dmg needs hdiutil.
    # The runner is Apple Silicon, the only target the Makefile packages (MacosArm64).
    runs-on: macos-latest
    # Shows each build in the Environments sidebar, as in adminer-desktop. Named after the
    # platform and not the runner image, which changes at the next bump, and renaming an
    # environment loses its deployment history.
    environment: macos-arm64
    permissions:
      contents: write
    steps:
      # An empty ref is the branch the run was started from.
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - name: Cache Kotlin Native toolchain
        uses: actions/cache@v6
        with:
          path: ~/.konan
          key: konan-macos-${{ hashFiles('**/*.gradle.kts', '**/gradle.properties') }}
          restore-keys: konan-macos-

      # create-dmg and dylibbundler, plus the qpdf and gs that go inside the bundle.
      - run: make install-bins

      - run: make macos_dmg

      - uses: actions/upload-artifact@v7
        with:
          name: ofis-macos-arm64
          path: build/Ofis.dmg
          if-no-files-found: error

      # Upload, never create: gh finds a draft or a published release by its tag, and
      # --clobber lets a re-run replace the DMG. The prerelease flag is held here rather
      # than trusted to a checkbox, so a beta never shows as "Latest". Delete that line at
      # the first stable tag.
      - name: Attach the DMG to the release
        if: inputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          gh release upload "$TAG" build/Ofis.dmg --clobber
          gh release edit "$TAG" --prerelease
