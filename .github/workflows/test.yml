name: Test

on:
  pull_request:

jobs:
  test-macos-arm:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25

      - name: Cache Kotlin Native toolchain
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-macos-${{ hashFiles('**/*.gradle.kts', '**/gradle.properties') }}
          restore-keys: konan-macos-

      - name: Install tools
        run: make install bins

      - name: Run tests
        run: make test
