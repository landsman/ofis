# Only deviations from detekt's defaults (buildUponDefaultConfig = true)

complexity:
  TooManyFunctions:
    excludes: ['**/tests/**']

empty-blocks:
  EmptyFunctionBlock:
    active: false

naming:
  FunctionNaming:
    # Compose functions are PascalCase, test names are backticked sentences
    ignoreAnnotated: ['Composable']
    excludes: ['**/tests/**']
  # source roots are src/<platform>/kotlin, so the path never matches the package
  InvalidPackageDeclaration:
    active: false

style:
  MagicNumber:
    # colours and dp/sp sizes are design values, not magic numbers
    excludes: ['**/tests/**', '**/ui/**', '**/*.kts']
  UnusedImport:
    active: true
